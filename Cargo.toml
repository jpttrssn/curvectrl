[package]
name = "curvectrl"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A film negative scanning and RAW image editor"
repository = "https://github.com/jpttrssn/curvectrl"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rawloader = "0.37.2"
rust-embed = "8.8.0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.8"

[build-dependencies]
xdgen = "0.1"

[dev-dependencies]
# Already in the tree via wgpu; enables validating the WGSL at test time
# instead of at first launch (naga parses/validates it).
naga = "28"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../cosmic/libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
